# Streamlit's own palette only; `ui_theme.py` paints the rest of the UI and
# switches between these two sets of tokens from the header toggle.
[theme]
base = "dark"
primaryColor = "#f2a93b"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0e1626"
textColor = "#ecf1f9"
font = "sans serif"

[server]
maxUploadSize = 800
enableXsrfProtection = false
enableCORS = false
maxMessageSize = 800
